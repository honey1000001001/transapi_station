services:
  # -------------------------------------------------------
  # Proxy Web API - DeepSeek upstream proxy forwarding service
  # -------------------------------------------------------
  proxy-web-api:
    build:
      context: ./proxy_web_api
      dockerfile: Dockerfile
    container_name: transapi-proxy-web-api
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-2063}:8000"
    volumes:
      - ./proxy_web_api/config.json:/app/config.json
    environment:
      - TZ=UTC
    networks:
      - transapi-net

  # -------------------------------------------------------
  # Backend - FastAPI application
  # -------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transapi-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/transapi.db
      - REDIS_URL=redis://redis:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY:-sk-deepseek2api}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@transapi.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - UPSTREAM_BASE_URL=http://proxy-web-api:8000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80}
      - APP_NAME=TransAPI Station
      - DEBUG=${DEBUG:-false}
    volumes:
      - backend-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - transapi-net

  # -------------------------------------------------------
  # Frontend - React SPA served by nginx
  # -------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transapi-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - transapi-net

  # -------------------------------------------------------
  # Redis - caching, rate limiting, sessions
  # -------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: transapi-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transapi-net

networks:
  transapi-net:
    driver: bridge

volumes:
  redis-data:
  backend-data:
